<ng-container>
  @if (control()['invalid'] && control()['dirty'] && control()['touched']) {
  <div class="alert alert-danger" role="alert">
    @let errors = control()['errors'] | keyvalue;
    @for(error of errors; track $index) {
    * {{ errorMessages[error.key] }}
    }
  </div>
  }
</ng-container>
