<div class="page">
  <!-- Header -->
  <div class="page-header">
    <a class="back-link" routerLink="/landing/events">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M19 12H5M5 12L11 18M5 12L11 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back to Events
    </a>
    <div class="page-header__text">
      <h1>New Event</h1>
      <p>Fill in the details below to create a new event</p>
    </div>
  </div>

  <!-- Form card -->
  <div class="form-card">
    <form [formGroup]="form" (ngSubmit)="onSaveEvent()" novalidate>

      <!-- Basic info -->
      <div class="form-section">
        <span class="form-section__label">BASIC INFO</span>
        <app-text-input
          [formGroup]="form"
          control="name"
          label="Event name"
          placeholder="e.g. Wine & Dine Gala"
        />

        <div class="field-group" [formGroup]="form">
          <label class="form-label" for="description">
            Description
            <span aria-hidden="true">*</span>
          </label>
          <textarea
            id="description"
            formControlName="description"
            class="form-control"
            rows="4"
            placeholder="Describe the event..."
          ></textarea>
          <app-input-errors [control]="form.controls.description" />
        </div>
      </div>

      <!-- Date & time -->
      <div class="form-section">
        <span class="form-section__label">DATE &amp; TIME</span>
        <div class="form-row-grid">
          <app-text-input
            [formGroup]="form"
            control="startDateTime"
            label="Start date & time"
            type="datetime-local"
          />
          <app-text-input
            [formGroup]="form"
            control="endDateTime"
            label="End date & time"
            type="datetime-local"
          />
        </div>
      </div>

      <!-- Logistics -->
      <div class="form-section">
        <span class="form-section__label">LOGISTICS</span>
        <div class="form-row-grid">
          <app-text-input
            [formGroup]="form"
            control="location"
            label="Location"
            placeholder="e.g. The Grand Ballroom, Cape Town"
          />
          <app-text-input
            [formGroup]="form"
            control="expectedAttendees"
            label="Expected attendees"
            type="number"
            placeholder="e.g. 100"
          />
        </div>
        <app-select-input
          [formGroup]="form"
          control="status"
          label="Status"
          [options]="statusOptions"
        />
      </div>

      <!-- Actions -->
      <div class="form-actions">
        <a class="btn-cancel" routerLink="/landing/events">Cancel</a>
        <button type="submit" class="btn-save" [disabled]="saving()">
          @if (saving()) {
            Saving…
          } @else {
            Save Event
          }
        </button>
      </div>

    </form>
  </div>
</div>
