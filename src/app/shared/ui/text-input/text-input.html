<div class="mb-3" [formGroup]="formGroup()" >
  <label class="form-label">
    {{ label() }}
    @if(isRequired()) {
    <span>*</span>
    }
  </label>
  <input [formControlName]="control()" [type]="type()" [placeholder]="placeholder()" class="form-control" />
  <app-input-errors [control]="formGroup().controls[control()]" />
</div>
