<ng-container>
  @if (control()['invalid'] && control()['dirty'] && control()['touched']) {
    @for (error of getErrorMessages(); track $index) {
      <p class="field-error">
        <svg class="error-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="8" cy="8" r="7.25" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8 4.5V8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="8" cy="11" r="0.75" fill="currentColor"/>
        </svg>
        {{ error }}
      </p>
    }
  }
</ng-container>
