<div class="login-wrapper">
  <!-- Left branding panel -->
  <div class="branding-panel">
    <div class="branding-content">
      <div class="brand-logo">TAB</div>
      <h1 class="brand-tagline">Join us today</h1>
      <p class="brand-sub">Create your admin account and start managing everything in one place.</p>
    </div>
    <div class="branding-circles">
      <div class="circle circle-1"></div>
      <div class="circle circle-2"></div>
    </div>
  </div>

  <!-- Right form panel -->
  <div class="form-panel">
    <div class="form-container">
      <div class="form-header">
        <h2>Create account</h2>
        <p>Sign up to get started</p>
      </div>

      <div class="social-buttons">
        <button class="social-btn" (click)="signInWithGoogle()">
          <svg width="20" height="20" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M45.12 24.5C45.12 22.94 44.98 21.44 44.72 20H24V28.51H35.84C35.33 31.26 33.78 33.59 31.45 35.15V40.67H38.56C42.72 36.84 45.12 31.2 45.12 24.5Z" fill="#4285F4"/>
            <path d="M24 46C29.94 46 34.92 44.03 38.56 40.67L31.45 35.15C29.48 36.47 26.96 37.25 24 37.25C18.27 37.25 13.42 33.38 11.69 28.18H4.34V33.88C7.96 41.07 15.4 46 24 46Z" fill="#34A853"/>
            <path d="M11.69 28.18C11.25 26.86 11 25.45 11 24C11 22.55 11.25 21.14 11.69 19.82V14.12H4.34C2.8 17.19 2 20.57 2 24C2 27.55 2.85 30.91 4.34 33.88L11.69 28.18Z" fill="#FBBC05"/>
            <path d="M24 10.75C27.23 10.75 30.13 11.86 32.41 14.04L38.72 7.73C34.91 4.18 29.93 2 24 2C15.4 2 7.96 6.93 4.34 14.12L11.69 19.82C13.42 14.62 18.27 10.75 24 10.75Z" fill="#EA4335"/>
          </svg>
          <span>Continue with Google</span>
        </button>
      </div>

      <div class="divider"><span>or</span></div>

      <form [formGroup]="credentialsForm">
        <app-text-input [formGroup]="credentialsForm" [control]="'email'" [label]="'Email'" />
        <app-text-input [formGroup]="credentialsForm" [control]="'password'" [label]="'Password'" />
        <button type="submit" class="btn btn-primary login-btn">Create account</button>
      </form>

      <p class="register-prompt">
        Already have an account? <a [routerLink]="'/auth'">Sign in</a>
      </p>
    </div>
  </div>
</div>
