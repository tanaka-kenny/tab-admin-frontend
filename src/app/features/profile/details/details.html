<div class="container my-5">
  <form [formGroup]="detailsForm" class="mx-auto col-12 col-md-6 col-lg-4">
    <h2>Personal Details</h2>
    <app-text-input
      [formGroup]="detailsForm"
      [control]="'firstName'"
      [label]="'First Name(s)'"
    />
    <app-text-input
      [formGroup]="detailsForm"
      [control]="'lastName'"
      [label]="'Last Name'"
    />

    <h2>Company Details</h2>
    <app-text-input
      [formGroup]="detailsForm"
      [control]="'companyName'"
      [label]="'Company Name'"
    />

    <h2>Address Details</h2>
    <app-text-input
      [formGroup]="detailsForm"
      [control]="'street1'"
      [label]="'Street Address'"
    />
    <app-text-input
      [formGroup]="detailsForm"
      [control]="'street2'"
      [label]="'Street 2'"
    />
    <app-text-input
      [formGroup]="detailsForm"
      [control]="'suburb'"
      [label]="'Suburb'"
    />
    <app-text-input
      [formGroup]="detailsForm"
      [control]="'city'"
      [label]="'City'"
    />
    <app-select-input
      [formGroup]="detailsForm"
      [control]="'province'"
      [label]="'Province'"
      [options]="provinces"
    />
    <app-text-input
      [formGroup]="detailsForm"
      [control]="'postalCode'"
      [label]="'Postal Code'"
    />

    <div class="d-flex justify-content-center align-items-center">
      <button class="btn btn-secondary">Back</button>
      <button class="btn btn-primary ms-2">Next</button>
    </div>
  </form>
</div>
