<div class="login-wrapper">
  <!-- Left branding panel -->
  <div class="branding-panel">
    <div class="branding-content">
      <div class="brand-logo">TAB</div>
      <h1 class="brand-tagline">Welcome back</h1>
      <p class="brand-sub">Sign in to your admin dashboard and manage everything in one place.</p>
    </div>
    <div class="branding-circles">
      <div class="circle circle-1"></div>
      <div class="circle circle-2"></div>
    </div>
  </div>

  <!-- Right form panel -->
  <div class="form-panel">
    <div class="form-container">
      <div class="form-header">
        <h2>Sign in</h2>
        <p>Enter your credentials to continue</p>
      </div>

      <div class="social-buttons">
        <button class="social-btn" (click)="signInWithGoogle()">
          <svg width="20" height="20" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M45.12 24.5C45.12 22.94 44.98 21.44 44.72 20H24V28.51H35.84C35.33 31.26 33.78 33.59 31.45 35.15V40.67H38.56C42.72 36.84 45.12 31.2 45.12 24.5Z" fill="#4285F4"/>
            <path d="M24 46C29.94 46 34.92 44.03 38.56 40.67L31.45 35.15C29.48 36.47 26.96 37.25 24 37.25C18.27 37.25 13.42 33.38 11.69 28.18H4.34V33.88C7.96 41.07 15.4 46 24 46Z" fill="#34A853"/>
            <path d="M11.69 28.18C11.25 26.86 11 25.45 11 24C11 22.55 11.25 21.14 11.69 19.82V14.12H4.34C2.8 17.19 2 20.57 2 24C2 27.55 2.85 30.91 4.34 33.88L11.69 28.18Z" fill="#FBBC05"/>
            <path d="M24 10.75C27.23 10.75 30.13 11.86 32.41 14.04L38.72 7.73C34.91 4.18 29.93 2 24 2C15.4 2 7.96 6.93 4.34 14.12L11.69 19.82C13.42 14.62 18.27 10.75 24 10.75Z" fill="#EA4335"/>
          </svg>
          <span>Continue with Google</span>
        </button>
        <button class="social-btn" (click)="signInWithMicrosoft()">
          <img src="/images/Microsoft_logo.svg.png" alt="Microsoft" width="20" height="20" />
          <span>Continue with Microsoft</span>
        </button>
        <button class="social-btn">
          <svg width="20" height="20" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M40.9 40.9H33.79V29.76C33.79 27.1 33.74 23.69 30.09 23.69C26.38 23.69 25.82 26.58 25.82 29.57V40.9H18.7V17.99H25.53V21.12H25.63C26.31 19.96 27.3 18.99 28.48 18.34C29.67 17.69 31.01 17.37 32.36 17.42C39.57 17.42 40.9 22.17 40.9 28.33V40.9ZM10.68 14.86C9.86 14.86 9.06 14.62 8.39 14.17C7.71 13.71 7.18 13.07 6.87 12.32C6.55 11.56 6.47 10.73 6.63 9.93C6.79 9.13 7.18 8.39 7.76 7.82C8.34 7.24 9.07 6.85 9.87 6.69C10.67 6.53 11.5 6.61 12.26 6.92C13.01 7.23 13.66 7.76 14.11 8.44C14.56 9.12 14.81 9.92 14.81 10.73C14.81 12.25 13.56 13.51 12.26 14.11C11.76 14.61 11.23 14.86 10.68 14.86ZM14.24 40.9H7.12V17.99H14.24V40.9ZM44.44 0H3.54C2.61 -0.01 1.72 0.35 1.05 1C0.39 1.65 0.01 2.53 0 3.46V44.54C0.01 45.47 0.39 46.35 1.05 47C1.72 47.65 2.61 48.01 3.54 48H44.44C45.37 48.01 46.27 47.65 46.94 47C47.61 46.35 47.99 45.47 48 44.54V3.46C47.99 2.53 47.61 1.64 46.94 0.99C46.27 0.35 45.37 -0.01 44.44 0Z" fill="#0A66C2"/>
          </svg>
          <span>Continue with LinkedIn</span>
        </button>
      </div>

      <div class="divider"><span>or</span></div>

      <form [formGroup]="loginForm">
        <app-text-input [formGroup]="loginForm" [control]="'email'" [label]="'Email'" />
        <app-text-input [formGroup]="loginForm" [control]="'password'" [label]="'Password'" />
        <p class="forgot-link">
          <a [routerLink]="'/auth/reset'">Forgot password?</a>
        </p>
        <button type="submit" class="btn btn-primary login-btn">Sign in</button>
      </form>

      <p class="register-prompt">
        Don't have an account? <a [routerLink]="'/profile'">Register</a>
      </p>
    </div>
  </div>
</div>
