<div class="container d-flex flex-column justify-content-center align-items-center my-5">
  <form [formGroup]="credentialsForm" class="col-12 col-md-6 col-lg-4">
    <h2>Forgot your password?</h2>
    <app-text-input
      [formGroup]="credentialsForm"
      [control]="'email'"
      [label]="'Email'"
    />
    <div class="d-flex justify-content-center align-items-center">
      <button class="btn btn-secondary">Cancel</button>
      <button class="btn btn-primary ms-2">Next</button>
    </div>
  </form>
      <p class="text-end my-3 me-3">
      <a [routerLink]="'/auth'">Back to login</a>
    </p>
</div>
